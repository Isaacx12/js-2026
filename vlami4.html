<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>asassa</title>
</head>
<body>

    <h3>20 db véletlen szám táblázatban</h3>

    <div>Legnagyobb szám:<span id="span1"></span></div>
    <div>Legkisebb szám:<span id="span2"></span></div>
    <div>Átlag:<span id="span3"></span></div>
    <br><br>

    <div>
        <table style="border: solid black 1px;" id="szamok">
            <h2>Random számok</h2>
        </table>
    </div>

    <div>
        <table style="border: solid black 1px;" id="parosok">
            <h2>Páros számok</h2>
        </table>
    </div>

    <div>
        <table style="border: solid black 1px;" id="paratlanok">
            <h2>Páratlan számok</h2>
        </table>
    </div>

    <div>
        <table style="border: solid black 1px;" id="hettel_oszthato">
            <h2>Héttel osztható</h2>
        </table>
    </div>

    <script>

        function random()
        {

            return Math.floor(Math.random() * 100);

        }
        const random2 = [];

        for(let i=1; i<=20; i++)
        {
            random2.push(random());
        }

        for(let i=0; i<random2.length; i++)
        {
            console.log(random2[i]);
            let tabla = "<tr><td>" + random2[i] + "</td></tr>";
            document.getElementById("szamok").innerHTML += tabla;
        }

        let legnagyobb = -1;
        for(let i=0; i<random2.length;i++)
        {

            if(random2[i]>legnagyobb)
            {

                legnagyobb = random2[i];
                document.getElementById("span1").innerHTML = " "+legnagyobb;
            }

        }

        let legkisebb = 100;
        for(let i=0; i<random2.length;i++)
        {

            if(random2[i]<legkisebb)
            {

                legkisebb = random2[i];
                document.getElementById("span2").innerHTML = " "+legkisebb;
            }

        }

        let osszeg = 0;
        for(let i=0; i<random2.length;i++)
        {

            osszeg += random2[i] / random2.length;
            document.getElementById("span3").innerHTML = " "+osszeg;

        }

        const parosok = [];
        const paratlanok = [];
        for(let i=0;i<random2.length;i++)
        {

            if(random2[i] % 2 == 0)
            {
                parosok.push(random2[i]);
            } else {

                if(random2[i] % 2 !== 0)
                {
                    paratlanok.push(random2[i]);
                }

            }

        }
        for(let i=0; i<parosok.length; i++)
            {
                let tabla = "<tr><td>" + parosok[i] + "</td></tr>";
                document.getElementById("parosok").innerHTML += tabla;
            }

        for(let i=0; i<paratlanok.length; i++)
            {
                let tabla2 = "<tr><td>" + paratlanok[i] + "</td></tr>";
                document.getElementById("paratlanok").innerHTML += tabla2;
            }

        const hettel = [];

        for(let i=0;i<random2.length;i++)
        {

            if(random2[i] % 7 == 0)
            {
                hettel.push(random2[i]);
            }

        }

        for(let i=0; i<hettel.length; i++)
            {
                let tabla3 = "<tr><td>" + hettel[i] + "</td></tr>";
                document.getElementById("hettel_oszthato").innerHTML += tabla3;
            }

        console.log(random2,parosok,paratlanok, hettel);


    </script>
    
</body>
</html>

<!-- 1. resz : keszitsunk egy olyan tablazatot amibe 20 darab veletlen szam van.
 2. rsz : a tablazat alatt valamilyen modon jelenjenmeg a 
 -legnagyobb szám
 -legkisebb szam
 -atlag
 
 legyen kivalogatas
 
 7-tel osthato szamok-->
