<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="szam1">elso szam</label>
    <input type="number" id="szam1">

    <label for="szam2">masodik szam</label>
    <input type="number" id="szam2">

    <button type="button" onclick="gyak3()">elküld</button>

    <div id="szamok">két szám közötti számok: </div>
    


    <script>

        function gyak3()
        {
            let sz1 = document.getElementById("szam1").value;
            let sz2 = document.getElementById("szam2").value;
            sz1 = parseInt(sz1);
            sz2 = parseInt(sz2);

            console.log(sz1, sz2);

            let szamok = document.getElementById("szamok");
            for(let i=sz1;i<sz2;i++)
            {
                szamok.innerHTML += i + ", ";
            }
            for(let i=sz2;i<sz1;i++)
            {
                szamok.innerHTML += i + ", ";
            }
        }

    </script>
    
</body>
</html>
