<body style="background-color: rgb(130, 129, 129); color: aliceblue;">

    <h1>Háromszögek</h1>
    <label for="bekeres">Hány háromszöget szeretnél?</label>

    <button type="button" onclick="haromszam()">Bekérés</button>

    </table>

    <script>


        function random()
        {

            return Math.floor(Math.random() * 100);

        }

        const szamok= [];
        const n = 3;
        function haromszam()
        {
            let bekeres = parseInt(document.getElementById("bekeres").value);

            for(let k=0;k<bekeres;k++)
            {

                for(let i=0;i<3;i++)
                {

                    szamok.push(random());

                }
                console.log(szamok);
            }

            let tabla = 0;
            for(let i=0;i<szamok.length;i+= n)
            {

                document.getElementById("osszes").innerHTML += "<tr><td>" + szamok.slice(i, i + n) + "</td></tr>";

            }

        }

    </script>
    
</body>
