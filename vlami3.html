<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idő</title>
</head>
<body>

    <button type="button" onclick="ido()">klikk</button>
    <div id="div"></div>
    <div id="div2"></div>

    <script>

        const idok = [];

        function ido()
        {

            const d = new Date();
            document.getElementById("div").innerHTML=d.getHours() + " hour " + d.getMinutes() + " minute " + d.getSeconds() + " seconds ";

            console.log(d.getHours(), d.getMinutes(), d.getSeconds())

            idok.push(d.getHours() + " : " + d.getMinutes() + " : " + d.getSeconds());
            document.getElementById("div2").innerHTML = idok;
            console.log(idok);

        }   

    </script>
    
</body>
</html>
