        <div>

    <script>
        function letrehoz1()
        {
            let b=document.getElementById("bill1");
            //console.log(b);

            let szoveg=" "

            for(let k=0;k<3;k++)
            {
                szoveg+='<div class="row">';
                for(let i=0;i<3;i++)
                {
                    szoveg+='<div class="col-4 text-center border py-3">' + (i + 1 + k*3) + '</div>';
                }
                szoveg+="</div>";
            }
                szoveg+='<div class="row">';
                for(let i=0;i<3;i++)
                {
                    if(i===1)
                    {
                        szoveg+='<div class="col-4 text-center border py-3">0</div>';
                    }
                    else
                    {
                        szoveg+='<div class="col-4 text-center border py-3"></div>';
                    }
                }
                szoveg+="</div>";

            b.innerHTML+=szoveg;
        }

        function letrehoz2()
        {
            let b=document.getElementById("bill2");
            //console.log(b);

            let szoveg=" "

            for(let k=0;k<3;k++)
            {
                szoveg+=sorKeszit([k*3+1,k*3+2,k*3+3]);
            }
                szoveg+=sorKeszit(["",0,""]);

            b.innerHTML+=szoveg;
        }

        function sorKeszit(szamok)
        {

            szoveg='<div class="row">';
            for(let i=0;i<3;i++)
            {
                 szoveg+='<div class="col-4 text-center border py-3">' + szamok[i] + '</div>';
            }
            szoveg+="</div>";

            return szoveg;

        }

        {

            /*let b=document.getElementById("bill2");

                </div> */

            /*let szoveg=" "

            for(let k=0;k<3;k++)
            {
                let sor=sorKeszitDOM([k*3+1,k*3+2,k*3+3]);
                b.appendChild(sor);
            }
            let sor=sorKeszitDOM(["",0,""]);
            b.appendChild(sor);


                sorKeszitDOM(1);

        }

        function cellaKeszit(szam)
        {
            let cella = document.createElement("div");
            cella.className="col-4 text-center border py-3";
            cella.innerHTML=szam;

            return cella;
        }

         function sorKeszitDOM(szamok)
        {

            let sor=document.createElement("div");
            sor.className="row";

            for(let i=0;i<3;i++)
            {
                let cella=cellaKeszit(szamok[i]);
                sor.appendChild(cella);
            }

            return sor;

        }


    </script>
