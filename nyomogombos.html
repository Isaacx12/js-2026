<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Nyomogombos telefon</title>
</head>
<body onload="letrehoz1()">
    <div class="container">
        <header class="row">
            <h1 class="col-12 text-center p-5 mb-5 bg-info text-white">Számbillentyű</h1>
        </header>
    </div>

        <div class="col-5 container">

            <div class="row">
                <div class="row">
            <div class="col-3 container">
                <div class="row">
                    <div class="col-4 text-center border py-3">1</div>
                    <div class="col-4 text-center border py-3">2</div>
                    <div class="col-4 text-center border py-3">3</div>
                </div>
                <div class="row">
                    <div class="col-4 text-center border py-3">1</div>
                    <div class="col-4 text-center border py-3">2</div>
                    <div class="col-4 text-center border py-3">3</div>
                </div>

                <div class="row">
                    <div class="col-4 text-center border py-3">1</div>
                    <div class="col-4 text-center border py-3">2</div>
                    <div class="col-4 text-center border py-3">3</div>
                </div>
                <div class="row">
                    <div class="col-4 text-center border py-3">*</div>
                    <div class="col-4 text-center border py-3">0</div>
                    <div class="col-4 text-center border py-3">#</div>
                </div>
            </div>
            <div class="col-3 container" id="bill1"></div>
            </div>

        
        <div>

    </div>

    <script>
        function letrehoz1()
        {
            let b=document.getElementById("bill1");
            //console.log(b);

            let szoveg=" "

            for(let k=0;k<3;k++)
            {
                szoveg+='<div class="row">';
                for(let i=0;i<3;i++)
                {
                    szoveg+='<div class="col-4 text-center border py-3">' + (i + 1 + k*3) + '</div>';
                }
                szoveg+="</div>";
            }
                szoveg+='<div class="row py-2">';
                for(let i=0;i<3;i++)
                {
                    if(i===1)
                    {
                        szoveg+='<div class="col-4 text-center border py-3">0</div>';
                    }
                    else
                    {
                        szoveg+='<div class="col-4 text-center border py-3"></div>';
                    }
                }
                szoveg+="</div>";

            b.innerHTML=szoveg;
        }
    </script>
    
</body>
</html>
