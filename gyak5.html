<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <label for="szoveg">Kérek egy szöveget vagy számot:</label>
    <input type="text" id="szoveg">
    <br><br>
    <label for="szam">kérek egy számot:</label>
    <input type="number" id="szam">
    <br>
    <button type="button" onclick="szines()">elküld</button>

    <div id="valami" style="color: green;"></div>

    <script>

        function szines()
        {

            let szoveg = document.getElementById("szoveg").value;
            let szam = document.getElementById("szam").value;
            szam = parseInt(szam);

            console.log(szoveg);
            console.log(szam);

            for(let i=0;i<=szam;i++)
            {

                valami.innerHTML+=szoveg + " ";

            }

        }

    </script>
    
</body>
</html>
