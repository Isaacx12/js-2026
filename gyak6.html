<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <label for="szam">kérek egy számot:</label>
    <input type="number" id="szam">
    <br>
    <button type="button" onclick="szamiras()">elküld</button>

    <script>
        function szamiras()
        {
            let szam = document.getElementById("szam").value;
            szam = parseInt(szam);
            console.log(szam);

            for(let i=0;i<=szam;i++)
            {

                const para = document.createElement("div");
                para.innerText = szam;
                document.body.appendChild(para);
                para.style.border="solid #000000";
                para.style.background="#8ab0cf";


            }
        }
    </script>

</body>
</html>
