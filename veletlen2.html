<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form>
        <fieldset>
            <legend>Véletlen számok</legend>

            <label for="szam">Hány jegyű véletelen számot akarsz 0 és 10 között?:</label>
            <input type="number" id="szam">

            <button type="button" onclick="random()">Beadás</button>
        </fieldset>
    </form>

    <div id="randomSz"></div>



    <script>

        function random()
        {

            let a = parseInt(document.getElementById("szam").value);
            let div = document.getElementById("randomSz");
            console.log(a);

            if(a>0 && a<=10)
            {

            div.innerHTML = Math.floor(Math.random() * (9*10**(a-1))) + 10**(a-1);

            } else {

                div.innerHTML = "FALSE"
            }

        }

    </script>
    
</body>
</html>
