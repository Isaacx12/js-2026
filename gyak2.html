<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="egyjegyu"></div>
    

    <script>

        function osszege()
        {
            let osszeg = 0;

            for(let i=0;i<10;i++)
            {
                osszeg+=i;
            }
            document.getElementById("egyjegyu").innerHTML=osszeg;
        }

    </script>


</body>
</html>

<!--legyen 1 hely az oldalon, ahol megjelenik az egyjegyu szamok osszege.-->
