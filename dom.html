<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: rgb(215, 221, 221);">
    <button id="gomb1" onclick="elso()">1</button>
    <button id="gomb2" onclick="masodik()">2</button>
    <button id="harmadik" onclick="harmadih()">3</button>

    <script>
        function elso(){
            document.getElementById("gomb1").innerHTML="digidigidigidigi hey!"
        }
            let darab = 0;

        function masodik(){
            darab ++;
            document.getElementById("gomb2").innerHTML=darab
        }
        function harmadih(){
            setInterval(masodik, 1000);
            
        }
    </script>
</body>
</html>
