<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Párosság</title>
</head>
<body>

    <h1 class="bg-success text-white text-center p-5 mb-2">Párosság</h1>
    <label for="szam">Kérek egy egész számot:</label>
    <input type="number" name="szam" id="szam" class="form-control">
    <button type="button" onclick="parossag()" class="btn btn-info">Küld</button>

    <div>
        <h2>Páratlan</h2>
        <div id="paratlanok"></div>
    </div>

    <div>
        <h2>Páros</h2>
        <div id="parosok"></div>
    </div>

    <script>
        function parossag()
        {
            let be = document.getElementById("szam");
            let beSzam = parseInt(be.value);
            console.log(beSzam);
            if(beSzam % 2 === 0)
            {
                document.getElementById("parosok").innerHTML += beSzam+" ";
            }
            else
            {
                document.getElementById("paratlanok").innerHTML += beSzam+" ";
            }
        }
    </script>
    
</body>
</html>
