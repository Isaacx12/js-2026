<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table,tr ,td{
            border: 1px black solid;
            border-collapse: collapse ;
        }
    </style>
    <title>Document</title>
</head>
<body onload="lotto()">
    
    <h1>Lottó számok</h1>

    <table>
        <thead>
            <th>A hét száma:</th>
            <th>Első szám:</th>
            <th>Második szám:</th>
            <th>Harmadik szám:</th>
            <th>Negyedik szám:</th>
            <th>Ötödik szám:</th>
        </thead>
        <tbody>
            <tr>
                <th>1.</th>
                <td></td>
            </tr>
        </tbody>
    </table>


    <script>

        function lotto()
        {

            let szam = Math.floor(Math.random() * (90-1) + 1 )

            let sor = " ";

            for(let i=0; i<=52; i++)
            {

                for(let k=0; k<=5; k++)
                {

                    sor+= "<td> szam </td>"

                }

            }

        }

    </script>
    
</body>
</html>
